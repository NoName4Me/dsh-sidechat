<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">旁敲侧击 Side Chat</title>
  <desc id="desc">在主对话旁选中一段内容，打开独立的侧聊；主对话保持不变，回填只进入草稿。</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="40" x2="1480" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFF"/>
      <stop offset="0.52" stop-color="#F1F5FD"/>
      <stop offset="1" stop-color="#EBF0FA"/>
    </linearGradient>
    <linearGradient id="panel" x1="800" y1="150" x2="800" y2="810" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FCFDFF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7A95FF"/>
      <stop offset="1" stop-color="#4868E4"/>
    </linearGradient>
    <linearGradient id="highlight" x1="170" y1="430" x2="860" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0F5FF"/>
      <stop offset="1" stop-color="#E4ECFF"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#D8E4FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#D8E4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#E8DFFF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#E8DFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#AEBED6" opacity="0.34"/>
    </pattern>
    <filter id="windowShadow" x="-12%" y="-16%" width="124%" height="144%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1B2A4A" flood-opacity="0.14"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#4F6FE8"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#D99A2B"/>
    </marker>
  </defs>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
    <rect width="1600" height="900" fill="url(#bg)"/>
    <circle cx="180" cy="120" r="330" fill="url(#glowA)"/>
    <circle cx="1460" cy="790" r="360" fill="url(#glowB)"/>
    <rect width="1600" height="900" fill="url(#dots)"/>

    <!-- Brand -->
    <g transform="translate(80 48) scale(1.5)">
      <path d="M9.5 6.5h13a5 5 0 0 1 5 5v7a5 5 0 0 1-5 5H16l-5.7 4.2c-.7.5-1.6 0-1.6-.8v-3.7a5 5 0 0 1-4.2-4.9v-6.8a5 5 0 0 1 5-5Z" fill="#454952" fill-opacity=".10"/>
      <path d="M9.5 6.5h13a5 5 0 0 1 5 5v7a5 5 0 0 1-5 5H16l-5.7 4.2c-.7.5-1.6 0-1.6-.8v-3.7a5 5 0 0 1-4.2-4.9v-6.8a5 5 0 0 1 5-5Z" stroke="#404650" stroke-width="1.9" stroke-linejoin="round"/>
      <path d="M10 13h10M10 17h6.7" stroke="#404650" stroke-width="1.9" stroke-linecap="round"/>
      <path d="M19 19.7h9a4.3 4.3 0 0 1 4.3 4.3v3.1a4.3 4.3 0 0 1-4.3 4.3h-2.8l-3 2.2c-.7.5-1.5 0-1.5-.8v-1.4h-1.7a4.3 4.3 0 0 1-4.3-4.3V24a4.3 4.3 0 0 1 4.3-4.3Z" fill="#5075D9" stroke="#4569CD" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M20 25.5h7.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <text x="150" y="84" fill="#1C2434" font-size="31" font-weight="700" letter-spacing="0.5">旁敲侧击</text>
    <text x="152" y="108" fill="#7B879B" font-size="13" font-weight="600" letter-spacing="2.4">SIDE CHAT FOR DEEPSEEK HARNESS</text>

    <rect x="1128" y="58" width="392" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.82" stroke="#DDE5F2"/>
    <circle cx="1156" cy="82" r="5" fill="#4F6FE8"/>
    <text x="1172" y="89" fill="#47536A" font-size="19" font-weight="600">在主线旁，问清楚。</text>

    <!-- Application window -->
    <g filter="url(#windowShadow)">
      <rect x="70" y="150" width="1460" height="660" rx="26" fill="url(#panel)" stroke="#E1E8F3"/>
    </g>
    <path d="M70 204H1530" stroke="#E8EDF6"/>
    <circle cx="100" cy="177" r="5.5" fill="#FF7A7A"/>
    <circle cx="124" cy="177" r="5.5" fill="#FFC14D"/>
    <circle cx="148" cy="177" r="5.5" fill="#35C77B"/>
    <text x="800" y="183" text-anchor="middle" fill="#7A8699" font-size="15" font-weight="500">DeepSeek Harness · 主对话</text>
    <rect x="1408" y="163" width="88" height="28" rx="14" fill="#F4F7FC" stroke="#E7ECF5"/>
    <text x="1452" y="182" text-anchor="middle" fill="#8793A7" font-size="12.5" font-weight="500">main session</text>

    <!-- Left rail -->
    <rect x="70" y="204" width="64" height="606" fill="#FAFBFE"/>
    <path d="M134 204V810" stroke="#E8EDF6"/>
    <rect x="88" y="226" width="28" height="28" rx="9" fill="#EDF2FF"/>
    <path d="M96 235h12M96 240h8M96 245h10" stroke="#4F6FE8" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="88" y="274" width="28" height="28" rx="9" fill="#F1F4F9"/>
    <rect x="96" y="282" width="5" height="5" rx="1.2" fill="#94A1B6"/>
    <rect x="104" y="282" width="5" height="5" rx="1.2" fill="#94A1B6"/>
    <rect x="96" y="290" width="5" height="5" rx="1.2" fill="#94A1B6"/>
    <rect x="104" y="290" width="5" height="5" rx="1.2" fill="#94A1B6"/>
    <rect x="88" y="322" width="28" height="28" rx="9" fill="#F1F4F9"/>
    <path d="M96 330h12M96 335h12M96 340h8" stroke="#94A1B6" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="88" y="370" width="28" height="28" rx="9" fill="#F1F4F9"/>
    <circle cx="102" cy="384" r="4.5" stroke="#94A1B6" stroke-width="1.6"/>
    <path d="M102 391v3" stroke="#94A1B6" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Main conversation -->
    <text x="168" y="236" fill="#1C2434" font-size="20" font-weight="700">主对话</text>
    <text x="168" y="257" fill="#8A96A9" font-size="12.5">Session · 主线上下文保持不变</text>
    <circle cx="858" cy="232" r="13" fill="#F4F7FC" stroke="#E7ECF5"/>
    <path d="M853 232h10M858 227v10" stroke="#94A1B6" stroke-width="1.5" stroke-linecap="round"/>

    <!-- User message -->
    <rect x="464" y="274" width="396" height="52" rx="16" fill="#EDF2FF"/>
    <text x="486" y="306" fill="#2A3550" font-size="18">这段 forkSeed 的边界是怎么算的？</text>

    <!-- Assistant answer -->
    <circle cx="190" cy="360" r="18" fill="url(#accent)"/>
    <text x="190" y="367" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">D</text>
    <text x="218" y="357" fill="#334155" font-size="14" font-weight="600">DeepSeek</text>
    <text x="302" y="357" fill="#98A3B6" font-size="12">主对话</text>
    <text x="168" y="394" fill="#334155" font-size="18">Fork 只继承锚点所在轮次结束之前的事件，</text>
    <text x="168" y="420" fill="#334155" font-size="18">不会把源点之后的主线对话带入子 Session。</text>

    <!-- Selection highlight -->
    <rect x="168" y="438" width="692" height="84" rx="14" fill="url(#highlight)" stroke="#A9BEFF" stroke-width="1.5"/>
    <rect x="168" y="438" width="5" height="84" rx="2.5" fill="#4F6FE8"/>
    <text x="195" y="471" fill="#263C7A" font-size="20" font-weight="700">边界 = 锚点所在或之后第一个 turn/end</text>
    <text x="195" y="499" fill="#55658A" font-size="16">只继承该已完成轮次之前的事件，后续讨论留在侧聊内。</text>
    <circle cx="166" cy="436" r="4" fill="#FFFFFF" stroke="#4F6FE8" stroke-width="1.4"/>
    <circle cx="862" cy="436" r="4" fill="#FFFFFF" stroke="#4F6FE8" stroke-width="1.4"/>
    <circle cx="166" cy="524" r="4" fill="#FFFFFF" stroke="#4F6FE8" stroke-width="1.4"/>
    <circle cx="862" cy="524" r="4" fill="#FFFFFF" stroke="#4F6FE8" stroke-width="1.4"/>

    <!-- Reply actions -->
    <rect x="168" y="540" width="90" height="30" rx="15" fill="#FFFFFF" stroke="#D8E1F2" filter="url(#softShadow)"/>
    <path d="M181 549h11a3 3 0 0 1 3 3v5a3 3 0 0 1-3 3h-4.5l-3.5 2.6v-2.6h-3a3 3 0 0 1-3-3v-5a3 3 0 0 1 3-3Z" stroke="#4F6FE8" stroke-width="1.4"/>
    <text x="204" y="560" fill="#334155" font-size="14" font-weight="600">侧聊</text>
    <circle cx="250" cy="555" r="8" fill="#4F6FE8"/>
    <text x="250" y="559" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">2</text>
    <circle cx="292" cy="555" r="13" fill="#F4F7FC" stroke="#E7ECF5"/>
    <rect x="287" y="550" width="8" height="9" rx="1.5" stroke="#94A1B6" stroke-width="1.3"/>
    <path d="M289 554h8v9h-8" stroke="#94A1B6" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="326" cy="555" r="13" fill="#F4F7FC" stroke="#E7ECF5"/>
    <path d="M320 556c3-4 9-4 12 0M322 560c2-2 6-2 8 0" stroke="#94A1B6" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="360" cy="555" r="13" fill="#F4F7FC" stroke="#E7ECF5"/>
    <circle cx="356" cy="555" r="1.4" fill="#94A1B6"/>
    <circle cx="360" cy="555" r="1.4" fill="#94A1B6"/>
    <circle cx="364" cy="555" r="1.4" fill="#94A1B6"/>

    <!-- Main thread continues -->
    <rect x="190" y="600" width="436" height="46" rx="14" fill="#F8FAFD" stroke="#E2E8F2" stroke-dasharray="5 5"/>
    <text x="212" y="629" fill="#8B96A8" font-size="14.5">主线继续推进，不受侧聊影响</text>

    <!-- Main composer -->
    <rect x="168" y="716" width="692" height="58" rx="18" fill="#F7F9FD" stroke="#E2E8F2"/>
    <circle cx="194" cy="745" r="10" fill="#EDF1F8"/>
    <path d="M194 740v10M189 745h10" stroke="#94A1B6" stroke-width="1.5" stroke-linecap="round"/>
    <text x="216" y="751" fill="#98A3B6" font-size="15.5">继续主对话…</text>
    <circle cx="830" cy="745" r="18" fill="#5075D9"/>
    <path d="M824 751l12-6-12-6v5l7 1-7 1v5Z" fill="#FFFFFF"/>

    <!-- Anchor markers -->
    <circle cx="888" cy="404" r="13" fill="#FFFFFF" stroke="#D8E1F2" filter="url(#softShadow)"/>
    <path d="M882 398h11a3 3 0 0 1 3 3v5a3 3 0 0 1-3 3h-4.5l-3.5 2.6v-2.6h-3a3 3 0 0 1-3-3v-5a3 3 0 0 1 3-3Z" stroke="#4F6FE8" stroke-width="1.3"/>
    <circle cx="888" cy="452" r="13" fill="#EDF2FF" stroke="#A9BEFF" filter="url(#softShadow)"/>
    <path d="M882 446h11a3 3 0 0 1 3 3v5a3 3 0 0 1-3 3h-4.5l-3.5 2.6v-2.6h-3a3 3 0 0 1-3-3v-5a3 3 0 0 1 3-3Z" stroke="#3F5BD8" stroke-width="1.3"/>

    <!-- Right side chat panel -->
    <path d="M930 204V810" stroke="#E8EDF6"/>
    <rect x="931" y="205" width="598" height="604" fill="#FCFDFF"/>
    <text x="958" y="236" fill="#1C2434" font-size="19" font-weight="700">旁敲侧击</text>
    <rect x="1064" y="218" width="30" height="22" rx="11" fill="#EDF2FF"/>
    <text x="1079" y="233" text-anchor="middle" fill="#3F5BD8" font-size="11.5" font-weight="700">2</text>
    <text x="958" y="258" fill="#8A96A9" font-size="12.5">仅显示当前主对话的侧聊</text>

    <rect x="1224" y="216" width="112" height="26" rx="13" fill="#E8F7F0" stroke="#BFE9D8"/>
    <text x="1280" y="234" text-anchor="middle" fill="#1F7A55" font-size="11.5" font-weight="600">独立 Session</text>
    <rect x="1348" y="216" width="92" height="26" rx="13" fill="#FFF6E5" stroke="#F0D9AE"/>
    <text x="1394" y="234" text-anchor="middle" fill="#9A6400" font-size="11.5" font-weight="600">工具全禁</text>
    <circle cx="1480" cy="229" r="13" fill="#F4F7FC" stroke="#E7ECF5"/>
    <circle cx="1476" cy="229" r="1.4" fill="#94A1B6"/>
    <circle cx="1480" cy="229" r="1.4" fill="#94A1B6"/>
    <circle cx="1484" cy="229" r="1.4" fill="#94A1B6"/>
    <path d="M930 268H1529" stroke="#EDF1F7"/>

    <!-- Quoted source -->
    <rect x="950" y="282" width="560" height="72" rx="13" fill="#F3F6FB"/>
    <rect x="966" y="298" width="18" height="18" rx="5" fill="#E3E9F4"/>
    <text x="975" y="312" text-anchor="middle" fill="#4F6FE8" font-size="14" font-weight="700">“</text>
    <text x="996" y="311" fill="#5C6980" font-size="15">…只继承锚点所在已完成轮次</text>
    <text x="996" y="334" fill="#5C6980" font-size="15">之前的事件…</text>
    <rect x="1374" y="298" width="112" height="24" rx="12" fill="#EEF3FF" stroke="#CBD9FF"/>
    <text x="1430" y="314" text-anchor="middle" fill="#3F5BD8" font-size="11.5" font-weight="600">继承上下文</text>

    <!-- Turn navigator -->
    <path d="M944 376V672" stroke="#E3E9F4" stroke-width="2" stroke-linecap="round"/>
    <circle cx="944" cy="394" r="4.5" fill="#C8D3E5"/>
    <circle cx="944" cy="572" r="5" fill="#4F6FE8"/>

    <!-- Turn 1 -->
    <rect x="1012" y="372" width="438" height="44" rx="14" fill="#EDF2FF"/>
    <text x="1032" y="400" fill="#2A3550" font-size="15.5">为什么不用最新轮次作为边界？</text>
    <rect x="1000" y="428" width="492" height="106" rx="15" fill="#FFFFFF" stroke="#E7ECF5"/>
    <circle cx="1023" cy="450" r="12" fill="url(#accent)"/>
    <text x="1023" y="454" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700">D</text>
    <text x="1044" y="455" fill="#40506C" font-size="14.5">侧聊只应看到发起时已经确定的上下文。</text>
    <text x="1022" y="481" fill="#40506C" font-size="14.5">以锚点后的第一个完成轮次为界，</text>
    <text x="1022" y="505" fill="#40506C" font-size="14.5">后续消息不会悄悄混入这次讨论。</text>

    <!-- Turn 2 -->
    <rect x="1012" y="552" width="398" height="42" rx="14" fill="#EDF2FF"/>
    <text x="1032" y="579" fill="#2A3550" font-size="15.5">升格会复制历史吗？</text>
    <rect x="1000" y="606" width="470" height="66" rx="15" fill="#FFFFFF" stroke="#E7ECF5"/>
    <circle cx="1023" cy="628" r="12" fill="url(#accent)"/>
    <text x="1023" y="632" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700">D</text>
    <text x="1044" y="633" fill="#40506C" font-size="14">不会。升格复用同一子 Session，</text>
    <text x="1022" y="656" fill="#40506C" font-size="14">只是把它附加到父会话工作区。</text>

    <!-- Side chat composer -->
    <rect x="950" y="714" width="560" height="56" rx="18" fill="#F5F7FB" stroke="#E2E8F2"/>
    <text x="972" y="748" fill="#98A3B6" font-size="15">继续追问…</text>
    <circle cx="1476" cy="742" r="18" fill="#1C2434"/>
    <path d="M1470 748l12-6-12-6v5l7 1-7 1v5Z" fill="#FFFFFF"/>

    <!-- Flow: selection to side chat -->
    <path d="M866 482C910 482 906 318 948 318" stroke="#4F6FE8" stroke-width="2.2" fill="none" marker-end="url(#arrowAccent)"/>
    <rect x="858" y="386" width="102" height="30" rx="15" fill="#FFFFFF" stroke="#D8E1F2" filter="url(#softShadow)"/>
    <text x="909" y="406" text-anchor="middle" fill="#3F5BD8" font-size="13.5" font-weight="600">就地展开</text>

    <!-- Flow: quote back to main draft -->
    <path d="M1002 770C950 803 760 806 706 760" stroke="#D99A2B" stroke-width="1.8" stroke-dasharray="6 5" fill="none" marker-end="url(#arrowAmber)"/>
    <rect x="742" y="776" width="194" height="28" rx="14" fill="#FFFFFF" stroke="#F0D9AE" filter="url(#softShadow)"/>
    <text x="839" y="795" text-anchor="middle" fill="#9A6400" font-size="12.5" font-weight="600">插入草稿 · 不自动发送</text>

    <!-- Feature strip -->
    <g filter="url(#softShadow)">
      <rect x="206" y="842" width="270" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.9" stroke="#DFE7F3"/>
      <rect x="492" y="842" width="270" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.9" stroke="#DFE7F3"/>
      <rect x="778" y="842" width="300" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.9" stroke="#DFE7F3"/>
      <rect x="1094" y="842" width="300" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.9" stroke="#DFE7F3"/>
    </g>
    <circle cx="230" cy="862" r="5" fill="#4F6FE8"/>
    <text x="246" y="868" fill="#47536A" font-size="17" font-weight="600">Light / Fork 双上下文</text>
    <circle cx="516" cy="862" r="5" fill="#2E9E6B"/>
    <text x="532" y="868" fill="#47536A" font-size="17" font-weight="600">来源锚点 · 一键定位</text>
    <circle cx="802" cy="862" r="5" fill="#D99A2B"/>
    <text x="818" y="868" fill="#47536A" font-size="17" font-weight="600">显式回填 · 不自动发送</text>
    <circle cx="1118" cy="862" r="5" fill="#7A6AE6"/>
    <text x="1134" y="868" fill="#47536A" font-size="17" font-weight="600">升格独立 · 不复制历史</text>
  </g>
</svg>
